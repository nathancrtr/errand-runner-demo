# Which meetings to read, and how far "my neighborhood" reaches. Plain data, not code.
# The exact spot is HOME_LAT and HOME_LON in .env, which stays out of the repo.
#
# The comments below are for whoever builds the tools: where each source publishes
# and how the model that runs the errand is kept on a leash. A reader can skip them.

days_ahead = 14
radius_km = 1.5

# Raleigh publishes to eSCRIBE, no key. The calendar is a POST to
# MeetingsCalendarView.aspx/GetCalendarMeetings with calendarStartDate and
# calendarEndDate. Each meeting's agenda is Meeting.aspx?Id=<ID>&Agenda=Agenda&lang=English,
# an HTML page with one div per item and FileStream.ashx links for attachments.
# Timestamps carry seconds, and StartDate can be wrong: 2026-09-15 says 11:03 for a
# meeting named "(11:30am)". When the name gives a time, trust the name.
# raleighnc.gov itself blocks scripts; don't fetch it.
# In the agenda HTML each item starts at <div class="AgendaItem AgendaItem<N> "> with
# AgendaItemCounter and AgendaItemTitle inside. After the last item comes a side panel,
# <div class="visible-md visible-lg AgendaItemSelectedDetailsContainer">, that repeats
# every attachment; stop before it.
[[body]]
name = "Raleigh City Council"
source = "escribe"
site = "https://pub-raleighnc.escribemeetings.com"
match = "City Council Meeting"

# Wake County publishes to the Legistar Web API, no key:
# https://webapi.legistar.com/v1/wake/events?$filter=EventDate ge datetime'YYYY-MM-DD'
# then events/<id>/eventitems?AgendaNote=1&Attachments=1. Attachments are docx and pdf.
# Eventitems come unordered; sort by EventItemAgendaSequence, with nulls last.
# A two-week window is often empty; event 6243 (2026-09-08, 52 items) is a real one to test on.
[[body]]
name = "Wake County Board of Commissioners"
source = "legistar"
client = "wake"
match = "Board of Commissioners"

# The city's open-data rezoning layer (ArcGIS). Ask for geometry and compute the
# distance from home yourself; the server-side buffer wasn't trustworthy. Useful fields:
# ZONE_CASE, Location, PrevZoning, ZON_REQ, STATUS, StatusDate. Ask with outSR=4326.
[cases]
service = "https://services.arcgis.com/v400IkDOw1ad7Yad/ArcGIS/rest/services/Rezoning_Case_Boundaries_View/FeatureServer/0"
status = "In Process"

# How the errand runs. The reader is Claude Code in print mode (`claude -p`) with
# --permission-mode default, so this machine's own permission mode can't loosen the
# leash, and --allowedTools naming only the errand commands. One agenda is eighty
# items, so the listing must stay compact or the model won't see all of it.
# --allowedTools alone is not a leash: default mode still lets read-only commands (ls,
# cat) and the Read tool through. Also pass --tools Bash, --setting-sources "",
# --strict-mcp-config, and via --settings a PreToolUse hook that refuses any command but
# one errand command with no shell syntax. Test it once, briefly: ask it to `cat .env`.
# eSCRIBE attachment URLs contain ? and &, so tell the reader to single-quote URLs.
#
# The commands are `errand meetings`, `errand item`, `errand read`, `errand cases`.
# The tool is one file, about 200 lines, with one way to do each thing.
# .venv already has requests and pypdf. launchd starts jobs with a bare PATH, and
# `claude` lives in ~/.local/bin.
